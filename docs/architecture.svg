<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">PayFlowLearning architecture</title>
  <desc id="desc">A REST client calls the payment service, which uses PostgreSQL and Redis and publishes payment events to Kafka. The audit service consumes those events and stores audit events in PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; }
      .accent { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #f0fdf4; stroke: #16a34a; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="430" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title" font-size="24">PayFlowLearning</text>
  <text x="550" y="67" text-anchor="middle" class="label">small payment lifecycle simulation</text>

  <rect x="45" y="160" width="170" height="82" class="box accent"/>
  <text x="130" y="193" text-anchor="middle" class="title">REST client</text>
  <text x="130" y="218" text-anchor="middle" class="label">curl / Swagger UI</text>

  <rect x="285" y="130" width="220" height="142" class="box accent"/>
  <text x="395" y="169" text-anchor="middle" class="title">payment-service</text>
  <text x="395" y="196" text-anchor="middle" class="label">REST API</text>
  <text x="395" y="220" text-anchor="middle" class="label">state transitions</text>
  <text x="395" y="244" text-anchor="middle" class="label">idempotency checks</text>

  <rect x="610" y="90" width="190" height="78" class="box green"/>
  <text x="705" y="124" text-anchor="middle" class="title">PostgreSQL</text>
  <text x="705" y="148" text-anchor="middle" class="label">payments</text>

  <rect x="610" y="198" width="190" height="78" class="box orange"/>
  <text x="705" y="232" text-anchor="middle" class="title">Redis</text>
  <text x="705" y="256" text-anchor="middle" class="label">payment cache</text>

  <rect x="610" y="306" width="190" height="78" class="box"/>
  <text x="705" y="340" text-anchor="middle" class="title">Kafka</text>
  <text x="705" y="364" text-anchor="middle" class="label">payment-events</text>

  <rect x="895" y="130" width="170" height="142" class="box accent"/>
  <text x="980" y="169" text-anchor="middle" class="title">audit-service</text>
  <text x="980" y="196" text-anchor="middle" class="label">Kafka consumer</text>
  <text x="980" y="220" text-anchor="middle" class="label">audit REST API</text>
  <text x="980" y="244" text-anchor="middle" class="label">audit_events</text>

  <path d="M215 201 H285" class="line"/>
  <path d="M505 165 H610" class="line"/>
  <path d="M505 220 H610" class="line"/>
  <path d="M505 250 C550 250 555 345 610 345" class="line"/>
  <path d="M800 345 C850 345 850 220 895 220" class="line"/>
  <text x="548" y="331" text-anchor="middle" class="label">events</text>
  <text x="850" y="306" text-anchor="middle" class="label">consume</text>
</svg>
