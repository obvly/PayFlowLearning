name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify both services including PostgreSQL integration tests
        run: make verify

      - name: Build and wait for full Compose stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Run end-to-end smoke test
        run: make smoke

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
